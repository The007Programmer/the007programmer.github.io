      PLACEHOLDER FONTS — dev preview only, see Task 5 report.
      Checked each family against the live Google Fonts CSS2 endpoint;
      "Tempting", "Switzer", "Vanguard", and "Athelas" all 400 (not
      real Google Fonts families, not just unlicensed — the plan's
      literal link tags for these would silently load nothing). Until
      the site owner supplies licensed self-hosted files or approves
      real replacements, these stand in so the 4 pairings are actually
      visually distinct for comparison:
        Tempting -> Bricolage Grotesque (already used site-wide)
        Switzer  -> Manrope
        Athelas  -> Source Serif 4
        Vanguard -> Work Sans
      Inter, Archivo, Abril Fatface, and STIX Two Text ARE real Google
      Fonts families and are loaded as named, no substitution.
    -->
    <!-- Tempting (placeholder: Bricolage Grotesque) + Switzer (placeholder: Manrope) -->

    <!-- Athelas (placeholder: Source Serif 4) + Vanguard (placeholder: Work Sans) -->

    <!-- Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Archivo + Abril (STIX Two Text as Abril's serif fallback) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Abril+Fatface&family=STIX+Two+Text&display=swap" rel="stylesheet">
