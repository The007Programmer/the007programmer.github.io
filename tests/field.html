<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>field harness</title>
  <link rel="stylesheet" href="../assets/src/main.css">
</head>
<body>
  <canvas class="agent-field" aria-hidden="true"></canvas>
  <main id="main">
    <section class="hero"><div class="hero-inner"><h1 class="hero-name">A</h1></div></section>
    <section class="figure-section"><div class="section-head"><h2 class="section-title">B</h2></div></section>
    <section class="path"><div class="section-head"><h2 class="section-title">C</h2></div></section>
    <section class="work"><div class="section-head"><h2 class="section-title">D</h2></div></section>
    <section class="contact"><div class="contact-grid"><h2 class="section-title">E</h2></div></section>
  </main>
  <pre id="out">not run</pre>
  <script src="../assets/src/field.js"></script>
  <script>
    (function () {
      const lines = [];
      const bands = window.AgentField.readBands();
      const PAPER = 'rgb(255, 241, 237)';
      const SLATE = 'rgb(57, 67, 79)';

      lines.push('bands.length === 5: ' + (bands.length === 5));

      bands.forEach(function (b, i) {
        const el = document.querySelectorAll('main > section, body > footer')[i];
        const cls = el ? el.className : '?';
        lines.push(i + ' class=' + cls + ' colour=' + b.colour + ' h=' + Math.round(b.bottom - b.top));
      });

      const distinct = {};
      bands.forEach(function (b) { distinct[b.colour] = true; });
      const distinctCount = Object.keys(distinct).length;
      lines.push('distinct colour count: ' + distinctCount);
      lines.push('DISCRIMINATION (distinct >= 2): ' + (distinctCount >= 2));

      lines.push('INHERITANCE .figure-section === slate: ' + (bands[1].colour === SLATE));
      lines.push('INHERITANCE .work === slate: ' + (bands[3].colour === SLATE));

      lines.push('.hero === paper: ' + (bands[0].colour === PAPER));
      lines.push('.path === paper: ' + (bands[2].colour === PAPER));
      lines.push('.contact === paper: ' + (bands[4].colour === PAPER));

      let mappingOk = true;
      bands.forEach(function (b, i) {
        const mid = (b.top + b.bottom) / 2;
        const ok = window.AgentField.colourAt(bands, mid) === b.colour;
        lines.push('MAPPING band' + i + ' (mid=' + Math.round(mid) + '): ' + ok);
        if (!ok) mappingOk = false;
      });
      lines.push('MAPPING all bands: ' + mappingOk);

      let boundaryOk = true;
      for (let i = 1; i < bands.length; i++) {
        const ok = window.AgentField.colourAt(bands, bands[i].top) === bands[i].colour;
        lines.push('BOUNDARY band' + i + ' top belongs to lower band: ' + ok);
        if (!ok) boundaryOk = false;
      }
      lines.push('BOUNDARY all: ' + boundaryOk);

      /* bands[0] is .hero and the last real band is .contact - both paper,
         so testing "above first" against the real page bands would pass
         vacuously even under the old buggy fall-through-to-last behaviour.
         Use a synthetic two-band array with deliberately distinct colours
         so the assertion actually discriminates first-band-clamp from
         last-band-fall-through. */
      const synth = [
        { top: 500, bottom: 600, colour: 'rgb(9, 9, 9)' },
        { top: 600, bottom: 700, colour: 'rgb(8, 8, 8)' }
      ];
      lines.push('ABOVE FIRST clamps to first band: ' +
        (window.AgentField.colourAt(synth, synth[0].top - 500) === synth[0].colour));

      lines.push('BELOW LAST clamps to last band: ' +
        (window.AgentField.colourAt(bands, bands[bands.length - 1].bottom + 500) === bands[bands.length - 1].colour));

      const bodyColour = window.getComputedStyle(document.body).color;
      lines.push('EMPTY bands reads body colour: ' +
        (window.AgentField.colourAt([], 100) === bodyColour));

      const emptyResult = window.AgentField.colourAt([], 100);
      lines.push('EMPTY bands is NOT a hardcoded literal: ' +
        (typeof emptyResult === 'string' && emptyResult.length > 0 && emptyResult === bodyColour));

      /* ── Repulsors (Task 3) ──────────────────────────────────
         The harness's only text element is a bare <h1>: not in
         TEXT_SEL by design (opt-in list, see field.js). It must be
         given a real TEXT_SEL class - see the "h1.hero-name" markup
         above - or this assertion is vacuous (would pass even if
         readRepulsors did nothing). */
      const rects = window.AgentField.readRepulsors();
      lines.push('repulsors: ' + rects.length);
      const h1 = document.querySelector('h1').getBoundingClientRect();
      const hit = rects.filter(function (r) {
        return r.left < h1.right && r.right > h1.left &&
               r.top < h1.bottom && r.bottom > h1.top;
      })[0];
      lines.push('h1 has a repulsor: ' + !!hit);
      if (hit) {
        lines.push('inflated left by: ' + Math.round(h1.left - hit.left));
        lines.push('inflated top by: ' + Math.round(h1.top - hit.top));
      }

      document.getElementById('out').textContent = lines.join('\n');
    }());
  </script>
</body>
</html>
